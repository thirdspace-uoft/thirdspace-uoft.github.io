name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env from secrets
        run: |
          cat > .env << 'EOF'
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT=${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT }}
          NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY }}
          NEXT_PUBLIC_IMAGEKIT_PRIVATE_KEY=${{ secrets.NEXT_PUBLIC_IMAGEKIT_PRIVATE_KEY }}
          EOF

      # ── Skip build if Firestore content hasn't changed ──
      # A cache entry can't be overwritten once saved, so each build saves under
      # its own key and later runs restore the newest one by prefix. With a
      # fixed key the first saved version stuck forever and every tick rebuilt.
      # Restore and save are split so skipped ticks don't save anything.
      - name: Restore last deployed version
        uses: actions/cache/restore@v5
        with:
          path: .last-deployed-ts
          key: last-deployed-ts-${{ github.run_id }}
          restore-keys: last-deployed-ts-

      # The content version changes when the site settings are saved, when any
      # post is saved, and when a scheduled post's time arrives (the count of
      # live posts goes up), so scheduled posts go live without anyone saving.
      # select() reads only three small fields per post, keeping each tick to a
      # handful of reads (Firestore free tier: 50,000/day).
      - name: Fetch content version from Firestore
        id: firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          CURRENT_TS=$(node --input-type=module -e "
            import { initializeApp, cert, getApps } from 'firebase-admin/app';
            import { getFirestore } from 'firebase-admin/firestore';
            const key = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_KEY);
            if (!getApps().length) initializeApp({ credential: cert(key) });
            const db = getFirestore();
            const site = await db.doc('config/site').get();
            const posts = await db.collection('posts').select('updatedAt', 'status', 'publishedAt').get();
            const now = Date.now();
            let latest = '';
            let live = 0;
            for (const d of posts.docs) {
              const p = d.data();
              if ((p.updatedAt || '') > latest) latest = p.updatedAt;
              if (p.status === 'published' && p.publishedAt && Date.parse(p.publishedAt) <= now) live++;
            }
            console.log([site.data()?.lastModified || '0', latest || '0', live].join('|'));
          ")
          CACHED_TS=$(cat .last-deployed-ts 2>/dev/null || echo "0")
          echo "CURRENT_TS=$CURRENT_TS" >> $GITHUB_OUTPUT
          echo "CACHED_TS=$CACHED_TS" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.firestore.outputs.CURRENT_TS }}" = "${{ steps.firestore.outputs.CACHED_TS }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip build if unchanged
        if: steps.check.outputs.skip == 'true'
        run: echo "No Firestore changes since last deploy — skipping"

      # ── Build only on cron/workflow_dispatch if content changed ──
      # Blog resource lookups (GitHub stars, video titles, paper metadata) are
      # cached between builds, so a down API falls back to the last answer.
      # Same per-run key scheme as the content version above.
      - name: Restore resource lookups
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache/restore@v5
        with:
          path: .cache
          key: resources-${{ github.run_id }}
          restore-keys: resources-

      - name: Build
        if: steps.check.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          # Raises the GitHub API rate limit for repo details on blog code cards.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Cache resource lookups
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: resources-${{ github.run_id }}

      - name: Save content version
        if: steps.check.outputs.skip != 'true'
        run: echo "${{ steps.firestore.outputs.CURRENT_TS }}" > .last-deployed-ts

      - name: Cache content version
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache/save@v5
        with:
          path: .last-deployed-ts
          key: last-deployed-ts-${{ github.run_id }}

      - name: Touch .nojekyll
        if: steps.check.outputs.skip != 'true'
        run: touch out/.nojekyll

      - name: Configure Pages
        if: steps.check.outputs.skip != 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true   # keep .nojekyll (v4+ drops dotfiles by default)

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so Pages' two are repeated.
    # actions: write lets this job start the share workflow.
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Share any newly live posts to X and LinkedIn. A separate workflow, so
      # this run's cancel-in-progress can never interrupt a half-sent post.
      - name: Start share workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run share-posts.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
