name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env from secrets
        run: |
          cat > .env << 'EOF'
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT=${{ secrets.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT }}
          NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY }}
          NEXT_PUBLIC_IMAGEKIT_PRIVATE_KEY=${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          EOF

      # ── Skip build if Firestore content hasn't changed ──
      - name: Cache last deployed timestamp
        id: cache-ts
        uses: actions/cache@v4
        with:
          path: .last-deployed-ts
          key: last-deployed-ts

      - name: Fetch lastModified from Firestore
        id: firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          CURRENT_TS=$(node --input-type=module -e "
            import { initializeApp, cert, getApps } from 'firebase-admin/app';
            import { getFirestore } from 'firebase-admin/firestore';
            const key = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_KEY);
            if (!getApps().length) initializeApp({ credential: cert(key) });
            const doc = await getFirestore().doc('config/site').get();
            console.log(doc.data()?.lastModified || '0');
          ")
          CACHED_TS=$(cat .last-deployed-ts 2>/dev/null || echo "0")
          echo "CURRENT_TS=$CURRENT_TS" >> $GITHUB_OUTPUT
          echo "CACHED_TS=$CACHED_TS" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.firestore.outputs.CURRENT_TS }}" = "${{ steps.firestore.outputs.CACHED_TS }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip build if unchanged
        if: steps.check.outputs.skip == 'true'
        run: echo "No Firestore changes since last deploy — skipping"

      # ── Build only on cron/workflow_dispatch if content changed ──
      - name: Build
        if: steps.check.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run build

      - name: Save timestamp
        if: steps.check.outputs.skip != 'true'
        run: echo "${{ steps.firestore.outputs.CURRENT_TS }}" > .last-deployed-ts

      - name: Touch .nojekyll
        if: steps.check.outputs.skip != 'true'
        run: touch out/.nojekyll

      - name: Configure Pages
        if: steps.check.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
